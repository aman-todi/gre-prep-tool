<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Verbal Reps</title>
<style>
  :root{
    --bg:#eef1f2;
    --surface:#ffffff;
    --surface-raised:#ffffff;
    --ink:#151b23;
    --ink-soft:#54626f;
    --ink-faint:#8793a0;
    --line:#dbe1e5;
    --accent:#b3791f;
    --accent-ink:#3a2a0c;
    --accent-soft:#f3e3c4;
    --good:#25795c;
    --good-soft:#dcf0e6;
    --bad:#a83c34;
    --bad-soft:#f6ded9;
    --shadow: 0 1px 2px rgba(21,27,35,.06), 0 8px 24px -12px rgba(21,27,35,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10151c;
      --surface:#182029;
      --surface-raised:#1e2733;
      --ink:#e9edf1;
      --ink-soft:#a3b0bc;
      --ink-faint:#6c7885;
      --line:#2b3543;
      --accent:#e0a63d;
      --accent-ink:#2a1f09;
      --accent-soft:#3a2e14;
      --good:#59c79a;
      --good-soft:#183527;
      --bad:#e2766c;
      --bad-soft:#3a2320;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10151c;
    --surface:#182029;
    --surface-raised:#1e2733;
    --ink:#e9edf1;
    --ink-soft:#a3b0bc;
    --ink-faint:#6c7885;
    --line:#2b3543;
    --accent:#e0a63d;
    --accent-ink:#2a1f09;
    --accent-soft:#3a2e14;
    --good:#59c79a;
    --good-soft:#183527;
    --bad:#e2766c;
    --bad-soft:#3a2320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', system-ui, -apple-system, sans-serif;
    padding-inline:16px;
    padding-block:20px;
  }
  .wrap{ max-width:640px; margin:0 auto; }

  h1,h2,h3{ font-family:'Newsreader', Georgia, serif; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top, 0px);
    z-index:5;
    background:var(--bg);
    padding-block:10px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .name{ font-size:1.3rem; font-weight:600; letter-spacing:-.01em; }
  .brand .tag{ font-size:.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; }
  .stats{ display:flex; gap:14px; align-items:center; }
  .stat{ text-align:right; }
  .stat .n{ font-family:'IBM Plex Mono', monospace; font-size:1.05rem; font-variant-numeric: tabular-nums; color:var(--accent); font-weight:500; }
  .stat .l{ font-size:.66rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.07em; }

  /* ---------- Progress ---------- */
  .progress-row{ display:flex; gap:5px; margin-bottom:18px; flex-wrap:wrap; }
  .progress-dot{
    flex:1 1 0; min-width:10px; height:6px; border-radius:3px;
    background:var(--line);
    transition: background .25s ease;
  }
  .progress-dot.done{ background:var(--good); }
  .progress-dot.miss{ background:var(--bad); }
  .progress-dot.current{ background:var(--accent); }
  .progress-dot{ cursor:pointer; }
  .progress-dot.touched{ background:var(--accent-soft); }


  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .tag-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .type-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent-ink); background:var(--accent-soft);
    padding:3px 9px; border-radius:100px; font-weight:500;
  }
  .item-index{ font-size:.75rem; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; }

  .passage{
    font-family:'Newsreader', Georgia, serif;
    font-size:1.02rem; line-height:1.6;
    color:var(--ink);
    background:var(--surface-raised);
    border-left:3px solid var(--line);
    padding:14px 16px;
    border-radius:4px;
    margin-bottom:16px;
  }
  .prompt{
    font-family:'Newsreader', Georgia, serif;
    font-size:1.16rem; line-height:1.55;
    margin-bottom:6px;
  }
  .question-line{ font-size:1.02rem; line-height:1.55; margin-bottom:16px; color:var(--ink); }
  .blank{
    display:inline-block; font-weight:600; color:var(--accent);
    border-bottom:2px dotted var(--accent);
    padding:0 3px; font-family:'IBM Plex Mono', monospace; font-size:.92em;
  }

  .blank-group-label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin:14px 0 8px; }
  .blank-group-label:first-of-type{ margin-top:2px; }

  .options{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
  .opt{
    text-align:left;
    display:flex; align-items:flex-start; gap:10px;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface-raised);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:.97rem;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover{ border-color:var(--ink-faint); }
  .opt:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .opt .k{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; color:var(--ink-faint);
    flex:0 0 auto; width:1.3em;
  }
  .opt.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .opt.correct{ border-color:var(--good); background:var(--good-soft); }
  .opt.incorrect{ border-color:var(--bad); background:var(--bad-soft); }
  .opt:disabled{ cursor:default; }
  .opt.correct .k, .opt.incorrect .k{ color:inherit; }

  .se-hint{ font-size:.78rem; color:var(--ink-faint); margin-bottom:10px; }

  .glossary{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .glossary-title{ font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-bottom:8px; }
  .gloss-row{ font-size:.88rem; line-height:1.5; color:var(--ink-soft); margin-bottom:4px; }
  .gloss-row b{ color:var(--ink); font-weight:600; font-family:'Newsreader', Georgia, serif; font-style:italic; }
  .gloss-syn{ color:var(--ink-faint); }

  .explain{
    margin-top:14px; padding:12px 14px;
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:.92rem; line-height:1.55; color:var(--ink-soft);
    animation: rise .2s ease;
  }
  .explain b{ color:var(--ink); font-weight:600; }
  @keyframes rise{ from{ opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .verdict{ font-weight:600; margin-bottom:4px; font-family:'Work Sans',sans-serif; font-size:.92rem; }
  .verdict.good{ color:var(--good); }
  .verdict.bad{ color:var(--bad); }

  .actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  button.primary, button.ghost{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size:.92rem;
    padding:11px 20px; border-radius:9px; cursor:pointer;
    border:1px solid transparent;
    transition: opacity .15s ease, transform .1s ease;
  }
  button.primary{ background:var(--accent); color:var(--accent-ink); }
  button.primary:disabled{ opacity:.4; cursor:not-allowed; }
  button.primary:not(:disabled):active{ transform:scale(.98); }
  button.ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  button.ghost:hover{ border-color:var(--ink-faint); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Start / Summary screens ---------- */
  .hero-card{ text-align:left; }
  .hero-card h2{ font-size:1.55rem; margin-bottom:6px; }
  .hero-card p.lede{ color:var(--ink-soft); font-size:.96rem; line-height:1.55; margin-bottom:18px; }
  .breakdown{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .chip{
    font-size:.8rem; padding:6px 11px; border-radius:100px;
    background:var(--surface-raised); border:1px solid var(--line); color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }
  .start-btn{ width:100%; padding:14px; font-size:1rem; border-radius:11px; }

  .score-big{
    font-family:'Newsreader', Georgia, serif; font-size:3rem; font-weight:600;
    color:var(--accent); line-height:1; margin-bottom:2px;
  }
  .score-sub{ color:var(--ink-faint); font-size:.85rem; margin-bottom:22px; }
  .breakdown-table{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .bt-row{ display:flex; align-items:center; justify-content:space-between; font-size:.9rem; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .bt-row:last-child{ border-bottom:none; padding-bottom:0; }
  .bt-label{ color:var(--ink-soft); }
  .bt-val{ font-family:'IBM Plex Mono', monospace; color:var(--ink); }

  .missed-words{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .word-chip{
    font-family:'Newsreader', Georgia, serif; font-style:italic; font-size:.94rem;
    padding:6px 12px; border-radius:100px; background:var(--bad-soft); color:var(--bad); border:1px solid transparent;
  }
  .empty-note{ color:var(--ink-faint); font-size:.88rem; }

  .streak-banner{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-raised); border:1px solid var(--line);
    border-radius:11px; padding:12px 14px; margin-bottom:20px;
  }
  .streak-banner .sn{ font-family:'IBM Plex Mono', monospace; font-size:1.4rem; color:var(--accent); font-weight:500; }
  .streak-banner .sl{ font-size:.82rem; color:var(--ink-soft); }

  footer.foot{ text-align:center; color:var(--ink-faint); font-size:.78rem; margin-top:22px; }


  /* ---------- Review screen ---------- */
  .review-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .review-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; font-size:.78rem; color:var(--ink-faint); }
  .review-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .review-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:18px; }
  .review-chip{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:9px 4px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-raised); color:var(--ink-soft); cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:.8rem;
    transition: border-color .15s ease, background .15s ease;
  }
  .review-chip:hover{ border-color:var(--ink-faint); }
  .review-chip .rc-type{ font-size:.58rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }
  .review-chip.current{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft) inset; }
  .review-chip.touched{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }
  .review-chip.done{ border-color:var(--good); background:var(--good-soft); color:var(--good); }
  .review-chip.miss{ border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
  .review-btn{ font-size:.72rem; padding:6px 12px; }

  @media (prefers-reduced-motion: reduce){
    .explain{ animation:none; }
    button.primary:active{ transform:none; }
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="name">Verbal Reps</div>
      <div class="tag">GRE verbal, daily</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n mono" id="streakStat">0</div><div class="l">streak</div></div>
      <div class="stat"><div class="n mono" id="timerStat">0:00</div><div class="l">time</div></div>
    </div>
  </div>

  <div id="progressRow" class="progress-row" hidden></div>
  <div id="app"></div>

  <footer class="foot">~16 items daily &middot; text completions, sentence equivalence, 2 passages with multiple questions each &middot; ~15–25 min &middot; a new set each morning</footer>
</div>

<script>
(function(){

  /* ============ CONTENT ============ */
  /* This object holds a single day's content. A scheduled task regenerates
     it and republishes this file each morning, so there is no rotation
     logic here — "today" is just whatever this block currently contains. */
  var DAY = { // REPLACE THIS ENTIRE OBJECT WITH TODAY'S REAL CONTENT BEFORE PUBLISHING
    // tc / tc2 / se items each carry a glossary: [{word, meaning, synonym}, ...]
    tc: [],
    tc2: { prompt:"", blanks:[{options:[],correct:0},{options:[],correct:0}], explain:"", glossary:[] },
    se: [],
    rc: []
  };

    /* ============ STATE ============ */
  var STORE_KEY = 'verbalRepsState_v1';
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }
  function yesterdayStr(){
    var d = new Date(); d.setDate(d.getDate()-1);
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { streak:0, lastCompletedDate:null, totalCompleted:0, missedWords:[] };
  }
  function saveState(s){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
  }
  var state = loadState();

  /* ============ BUILD ITEM LIST FOR TODAY ============ */
  function buildItems(){
    var s = DAY;
    var items = [];
    s.tc.forEach(function(q){ items.push({type:'tc', data:q}); });
    items.push({type:'tc2', data:s.tc2});
    s.se.forEach(function(q){ items.push({type:'se', data:q}); });
    // Each rc entry is a passage with 1–3 associated questions; flatten so
    // every question becomes its own stepper item while sharing the passage.
    s.rc.forEach(function(passage){
      passage.questions.forEach(function(q){
        items.push({type:'rc', data:{
          passage: passage.passage,
          question: q.question,
          options: q.options,
          correct: q.correct,
          explain: q.explain
        }});
      });
    });
    return items;
  }

  function freshItemState(it){
    if(it.type === 'se') return { checked:false, selSet:[], correct:null };
    if(it.type === 'tc2') return { checked:false, selA:null, selB:null, correct:null };
    return { checked:false, sel:null, correct:null };
  }

  function hasSelection(it, st){
    if(it.type === 'se') return st.selSet && st.selSet.length > 0;
    if(it.type === 'tc2') return st.selA !== null || st.selB !== null;
    return st.sel !== null;
  }

  function isComplete(it, st){
    if(it.type === 'se') return st.selSet && st.selSet.length === 2;
    if(it.type === 'tc2') return st.selA !== null && st.selB !== null;
    return st.sel !== null;
  }

  function isItemCorrect(it, st){
    if(!isComplete(it, st)) return false;
    if(it.type === 'tc' || it.type === 'rc') return st.sel === it.data.correct;
    if(it.type === 'se'){
      var sorted = st.selSet.slice().sort();
      var correctPair = it.data.correct.slice().sort();
      return sorted[0]===correctPair[0] && sorted[1]===correctPair[1];
    }
    if(it.type === 'tc2'){
      return st.selA === it.data.blanks[0].correct && st.selB === it.data.blanks[1].correct;
    }
    return false;
  }

  /* ============ APP STATE ============ */
  var screen = 'start'; // start | quiz | review | summary
  var items = [];
  var itemState = [];
  var idx = 0;
  var timerSec = 0, timerHandle = null;
  var alreadyDoneToday = state.lastCompletedDate === todayStr();

  var appEl = document.getElementById('app');
  var progressRow = document.getElementById('progressRow');
  var streakStat = document.getElementById('streakStat');
  var timerStat = document.getElementById('timerStat');

  streakStat.textContent = state.streak;

  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m+':'+(s<10?'0':'')+s;
  }
  function startTimer(){
    stopTimer();
    timerHandle = setInterval(function(){
      timerSec++; timerStat.textContent = fmtTime(timerSec);
    }, 1000);
  }
  function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

  function esc(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function goTo(i){
    idx = Math.max(0, Math.min(items.length - 1, i));
    screen = 'quiz';
    render();
  }

  function renderProgress(){
    if(screen !== 'quiz'){ progressRow.hidden = true; return; }
    progressRow.hidden = false;
    progressRow.innerHTML = '';
    items.forEach(function(it, i){
      var st = itemState[i];
      var dot = document.createElement('div');
      dot.className = 'progress-dot';
      if(st.checked){ dot.className += st.correct ? ' done' : ' miss'; }
      else if(hasSelection(it, st)){ dot.className += ' touched'; }
      if(i === idx){ dot.className += ' current'; }
      dot.title = 'Question ' + (i+1);
      dot.addEventListener('click', function(){ goTo(i); });
      progressRow.appendChild(dot);
    });
  }

  /* ============ START SCREEN ============ */
  function renderStart(){
    stopTimer();
    var dayNum = state.totalCompleted + 1;
    var html = '<div class="card hero-card">';
    if(alreadyDoneToday){
      html += '<h2>Today’s reps are done</h2>' +
        '<p class="lede">You already completed today’s set. Streak holds at <b>'+state.streak+'</b>. A fresh set arrives tomorrow morning — or run through today’s again for extra practice (won’t affect your streak).</p>' +
        '<div class="streak-banner"><div class="sn mono">'+state.streak+'</div><div class="sl">day streak' + (state.streak===1?'':'s') + '</div></div>' +
        '<button class="primary start-btn" id="startBtn">Practice again anyway</button>';
    } else {
      html += '<h2>Day '+dayNum+' &middot; Verbal Reps</h2>' +
        '<p class="lede">A short, mixed set: fill-in-the-blank vocabulary, best-pair sentence equivalence, and two short reading passages. Move freely between questions — jump around, skip, come back later — and check any question for an explanation whenever you want it. Finish whenever you&rsquo;re ready to see results.</p>' +
        '<div class="breakdown">' +
          '<span class="chip">5 text completion</span>' +
          '<span class="chip">1 double blank</span>' +
          '<span class="chip">4 sentence equivalence</span>' +
          '<span class="chip">2 passages &middot; 6 questions</span>' +
          '<span class="chip">~15–25 min</span>' +
        '</div>' +
        (state.streak > 0 ? '<div class="streak-banner"><div class="sn mono">'+state.streak+'</div><div class="sl">day streak &mdash; keep it going</div></div>' : '') +
        '<button class="primary start-btn" id="startBtn">Start today’s set</button>';
    }
    html += '</div>';
    appEl.innerHTML = html;
    document.getElementById('startBtn').addEventListener('click', function(){
      items = buildItems();
      itemState = items.map(freshItemState);
      idx = 0; timerSec = 0; timerStat.textContent = '0:00';
      screen = 'quiz';
      startTimer();
      render();
    });
  }

  /* ============ QUIZ SCREEN ============ */
  function typeLabel(t){
    return { tc:'Text Completion', tc2:'Text Completion · 2 Blanks', se:'Sentence Equivalence', rc:'Reading Comprehension' }[t];
  }
  function shortTypeLabel(t){
    return { tc:'TC', tc2:'TC2', se:'SE', rc:'RC' }[t];
  }

  function renderQuiz(){
    var it = items[idx];
    var st = itemState[idx];
    var body = '<div class="card">' +
      '<div class="tag-row"><span class="type-tag">'+typeLabel(it.type)+'</span>' +
      '<div style="display:flex;align-items:center;gap:10px;">' +
      '<span class="item-index mono">'+(idx+1)+' / '+items.length+'</span>' +
      '<button class="ghost review-btn" id="reviewBtn">Review</button>' +
      '</div></div>';

    if(it.type === 'tc'){
      body += renderTC(it.data, st);
    } else if(it.type === 'tc2'){
      body += renderTC2(it.data, st);
    } else if(it.type === 'se'){
      body += renderSE(it.data, st);
    } else if(it.type === 'rc'){
      body += renderRC(it.data, st);
    }
    body += navActionsHTML();
    body += '</div>';
    appEl.innerHTML = body;
    renderProgress();
    wireItem(it, st);
  }

  function explainHTML(correct, explainHtmlText, glossary){
    return '<div class="explain"><div class="verdict '+(correct?'good':'bad')+'">'+(correct?'Correct.':'Not quite.')+'</div>'+explainHtmlText+glossaryHTML(glossary)+'</div>';
  }

  function renderTC(q, st){
    var letters = ['A','B','C','D','E'];
    var html = '<div class="prompt">'+esc(q.prompt).replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')+'</div>';
    html += '<div class="options" id="optGroup">';
    q.options.forEach(function(opt,i){
      var cls = 'opt';
      if(st.checked){
        if(i === q.correct) cls += ' correct';
        else if(i === st.sel) cls += ' incorrect';
      } else if(i === st.sel){ cls += ' selected'; }
      html += '<button class="'+cls+'" data-i="'+i+'"'+(st.checked?' disabled':'')+'><span class="k mono">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '</div><div id="explainArea">'+(st.checked ? explainHTML(st.correct, q.explain, q.glossary) : '')+'</div>';
    return html;
  }

  function renderTC2(q, st){
    var letters = ['A','B','C'];
    var html = '<div class="prompt">'+esc(q.prompt)
      .replace('(i)___','<span class="blank">(i)</span>')
      .replace('(ii)___','<span class="blank">(ii)</span>')+'</div>';
    html += '<div class="blank-group-label">Blank (i)</div><div class="options" data-blank="0">';
    q.blanks[0].options.forEach(function(opt,i){
      var cls = 'opt';
      if(st.checked){
        if(i === q.blanks[0].correct) cls += ' correct';
        else if(i === st.selA) cls += ' incorrect';
      } else if(i === st.selA){ cls += ' selected'; }
      html += '<button class="'+cls+'" data-blank="0" data-i="'+i+'"'+(st.checked?' disabled':'')+'><span class="k mono">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '</div>';
    html += '<div class="blank-group-label">Blank (ii)</div><div class="options" data-blank="1">';
    q.blanks[1].options.forEach(function(opt,i){
      var cls = 'opt';
      if(st.checked){
        if(i === q.blanks[1].correct) cls += ' correct';
        else if(i === st.selB) cls += ' incorrect';
      } else if(i === st.selB){ cls += ' selected'; }
      html += '<button class="'+cls+'" data-blank="1" data-i="'+i+'"'+(st.checked?' disabled':'')+'><span class="k mono">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '</div><div id="explainArea">'+(st.checked ? explainHTML(st.correct, q.explain, q.glossary) : '')+'</div>';
    return html;
  }

  function renderSE(q, st){
    var letters = ['A','B','C','D','E','F'];
    var html = '<div class="prompt">'+esc(q.prompt).replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')+'</div>';
    html += '<div class="se-hint">Select the two answers that best complete the sentence with equivalent meaning.</div>';
    html += '<div class="options" id="optGroup">';
    q.options.forEach(function(opt,i){
      var cls = 'opt';
      var isCorrectOpt = q.correct.indexOf(i) >= 0;
      var wasSelected = st.selSet.indexOf(i) >= 0;
      if(st.checked){
        if(isCorrectOpt) cls += ' correct';
        else if(wasSelected) cls += ' incorrect';
      } else if(wasSelected){ cls += ' selected'; }
      html += '<button class="'+cls+'" data-i="'+i+'"'+(st.checked?' disabled':'')+'><span class="k mono">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '</div><div id="explainArea">'+(st.checked ? explainHTML(st.correct, q.explain, q.glossary) : '')+'</div>';
    return html;
  }

  function renderRC(q, st){
    var letters = ['A','B','C','D','E'];
    var html = '<div class="passage">'+esc(q.passage)+'</div>';
    html += '<div class="question-line">'+esc(q.question)+'</div>';
    html += '<div class="options" id="optGroup">';
    q.options.forEach(function(opt,i){
      var cls = 'opt';
      if(st.checked){
        if(i === q.correct) cls += ' correct';
        else if(i === st.sel) cls += ' incorrect';
      } else if(i === st.sel){ cls += ' selected'; }
      html += '<button class="'+cls+'" data-i="'+i+'"'+(st.checked?' disabled':'')+'><span class="k mono">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '</div><div id="explainArea">'+(st.checked ? explainHTML(st.correct, q.explain, null) : '')+'</div>';
    return html;
  }

  function navActionsHTML(){
    return '<div class="actions">' +
      '<button class="ghost" id="backBtn"'+(idx===0?' disabled':'')+'>Back</button>' +
      '<button class="ghost" id="checkBtn" disabled>Check</button>' +
      '<button class="primary" id="nextBtn"'+(idx===items.length-1?' disabled':'')+'>Next</button>' +
    '</div>';
  }

  function wireItem(it, st){
    var checkBtn = document.getElementById('checkBtn');
    var backBtn = document.getElementById('backBtn');
    var nextBtn = document.getElementById('nextBtn');
    var reviewBtn = document.getElementById('reviewBtn');

    backBtn.addEventListener('click', function(){ goTo(idx - 1); });
    nextBtn.addEventListener('click', function(){ goTo(idx + 1); });
    reviewBtn.addEventListener('click', function(){ screen = 'review'; render(); });

    checkBtn.disabled = st.checked || !isComplete(it, st);

    function gradeAndShow(){
      st.checked = true;
      var area = document.getElementById('explainArea');
      if(it.type === 'tc' || it.type === 'rc'){
        var correct = st.sel === it.data.correct;
        st.correct = correct;
        var opts = appEl.querySelectorAll('#optGroup .opt');
        opts.forEach(function(btn){
          var i = parseInt(btn.getAttribute('data-i'),10);
          btn.disabled = true;
          if(i === it.data.correct) btn.classList.add('correct');
          else if(i === st.sel) btn.classList.add('incorrect');
        });
        area.innerHTML = explainHTML(correct, it.data.explain, it.type==='tc' ? it.data.glossary : null);
      } else if(it.type === 'se'){
        var sorted = st.selSet.slice().sort();
        var correctPair = it.data.correct.slice().sort();
        var correct2 = sorted.length===2 && sorted[0]===correctPair[0] && sorted[1]===correctPair[1];
        st.correct = correct2;
        var opts2 = appEl.querySelectorAll('#optGroup .opt');
        opts2.forEach(function(btn){
          var i = parseInt(btn.getAttribute('data-i'),10);
          btn.disabled = true;
          var isCorrectOpt = it.data.correct.indexOf(i) >= 0;
          var wasSelected = st.selSet.indexOf(i) >= 0;
          if(isCorrectOpt) btn.classList.add('correct');
          else if(wasSelected) btn.classList.add('incorrect');
        });
        area.innerHTML = explainHTML(correct2, it.data.explain, it.data.glossary);
      } else if(it.type === 'tc2'){
        var aCorrect = st.selA === it.data.blanks[0].correct;
        var bCorrect = st.selB === it.data.blanks[1].correct;
        var correct3 = aCorrect && bCorrect;
        st.correct = correct3;
        var groupA = appEl.querySelectorAll('.options[data-blank="0"] .opt');
        var groupB = appEl.querySelectorAll('.options[data-blank="1"] .opt');
        groupA.forEach(function(btn){
          var i = parseInt(btn.getAttribute('data-i'),10);
          btn.disabled = true;
          if(i === it.data.blanks[0].correct) btn.classList.add('correct');
          else if(i === st.selA) btn.classList.add('incorrect');
        });
        groupB.forEach(function(btn){
          var i = parseInt(btn.getAttribute('data-i'),10);
          btn.disabled = true;
          if(i === it.data.blanks[1].correct) btn.classList.add('correct');
          else if(i === st.selB) btn.classList.add('incorrect');
        });
        area.innerHTML = explainHTML(correct3, it.data.explain, it.data.glossary);
      }
      checkBtn.disabled = true;
      renderProgress();
    }

    if(it.type === 'tc' || it.type === 'rc'){
      var opts = appEl.querySelectorAll('#optGroup .opt');
      opts.forEach(function(btn){
        btn.addEventListener('click', function(){
          if(st.checked) return;
          opts.forEach(function(b){ b.classList.remove('selected'); });
          btn.classList.add('selected');
          st.sel = parseInt(btn.getAttribute('data-i'),10);
          checkBtn.disabled = false;
          renderProgress();
        });
      });
      checkBtn.addEventListener('click', function(){
        if(st.sel===null || st.checked) return;
        gradeAndShow();
      });
    }

    else if(it.type === 'se'){
      var opts3 = appEl.querySelectorAll('#optGroup .opt');
      opts3.forEach(function(btn){
        btn.addEventListener('click', function(){
          if(st.checked) return;
          var i = parseInt(btn.getAttribute('data-i'),10);
          var pos = st.selSet.indexOf(i);
          if(pos >= 0){ st.selSet.splice(pos,1); btn.classList.remove('selected'); }
          else {
            if(st.selSet.length >= 2) return;
            st.selSet.push(i); btn.classList.add('selected');
          }
          checkBtn.disabled = st.selSet.length !== 2;
          renderProgress();
        });
      });
      checkBtn.addEventListener('click', function(){
        if(st.selSet.length !== 2 || st.checked) return;
        gradeAndShow();
      });
    }

    else if(it.type === 'tc2'){
      var groupA = appEl.querySelectorAll('.options[data-blank="0"] .opt');
      var groupB = appEl.querySelectorAll('.options[data-blank="1"] .opt');
      groupA.forEach(function(btn){
        btn.addEventListener('click', function(){
          if(st.checked) return;
          groupA.forEach(function(b){ b.classList.remove('selected'); });
          btn.classList.add('selected');
          st.selA = parseInt(btn.getAttribute('data-i'),10);
          checkBtn.disabled = !(st.selA!==null && st.selB!==null);
          renderProgress();
        });
      });
      groupB.forEach(function(btn){
        btn.addEventListener('click', function(){
          if(st.checked) return;
          groupB.forEach(function(b){ b.classList.remove('selected'); });
          btn.classList.add('selected');
          st.selB = parseInt(btn.getAttribute('data-i'),10);
          checkBtn.disabled = !(st.selA!==null && st.selB!==null);
          renderProgress();
        });
      });
      checkBtn.addEventListener('click', function(){
        if(st.selA===null || st.selB===null || st.checked) return;
        gradeAndShow();
      });
    }
  }

  /* ============ REVIEW SCREEN ============ */
  function renderReview(){
    var checkedCount = itemState.filter(function(st){ return st.checked; }).length;
    var answeredCount = items.filter(function(it,i){ return isComplete(it, itemState[i]); }).length;
    var html = '<div class="card">';
    html += '<div class="review-head"><h2 style="font-size:1.25rem;margin:0;">Review your answers</h2>' +
      '<button class="ghost" id="backToQuizBtn">Back to question</button></div>';
    html += '<div class="review-legend">' +
      '<span><span class="legend-dot" style="background:var(--good)"></span>Checked &middot; correct</span>' +
      '<span><span class="legend-dot" style="background:var(--bad)"></span>Checked &middot; incorrect</span>' +
      '<span><span class="legend-dot" style="background:var(--accent)"></span>Answered, not checked</span>' +
      '<span><span class="legend-dot" style="background:var(--line)"></span>Unanswered</span>' +
    '</div>';
    html += '<div class="review-grid">';
    items.forEach(function(it, i){
      var st = itemState[i];
      var cls = 'review-chip';
      if(st.checked) cls += st.correct ? ' done' : ' miss';
      else if(hasSelection(it, st)) cls += ' touched';
      if(i === idx) cls += ' current';
      html += '<button class="'+cls+'" data-i="'+i+'"><span class="rc-type">'+shortTypeLabel(it.type)+'</span><span>'+(i+1)+'</span></button>';
    });
    html += '</div>';
    html += '<p class="empty-note" style="margin-bottom:16px;">'+answeredCount+' / '+items.length+' questions answered ('+checkedCount+' checked).'+(answeredCount<items.length ? ' Anything left completely blank counts as incorrect — answers you’ve picked are graded whether or not you checked them.' : '')+'</p>';
    html += '<button class="primary start-btn" id="finishBtn">Finish &amp; see results</button>';
    html += '</div>';
    appEl.innerHTML = html;
    progressRow.hidden = true;
    document.getElementById('backToQuizBtn').addEventListener('click', function(){ screen = 'quiz'; render(); });
    document.getElementById('finishBtn').addEventListener('click', function(){ finishSession(); });
    appEl.querySelectorAll('.review-chip').forEach(function(btn){
      btn.addEventListener('click', function(){
        idx = parseInt(btn.getAttribute('data-i'),10);
        screen = 'quiz';
        render();
      });
    });
  }

  function glossaryHTML(glossary){
    if(!glossary || !glossary.length) return '';
    var html = '<div class="glossary"><div class="glossary-title">Words in this item</div>';
    glossary.forEach(function(g){
      html += '<div class="gloss-row"><b>'+esc(g.word)+'</b> — '+esc(g.meaning)+' <span class="gloss-syn">(≈ '+esc(g.synonym)+')</span></div>';
    });
    html += '</div>';
    return html;
  }

  /* ============ SUMMARY SCREEN ============ */
  function finishSession(){
    stopTimer();
    screen = 'summary';

    var tcCount = items.filter(function(it){return it.type==='tc'||it.type==='tc2';}).length;
    var seCount = items.filter(function(it){return it.type==='se';}).length;
    var rcCount = items.filter(function(it){return it.type==='rc';}).length;
    var tcCorrect = 0, seCorrect = 0, rcCorrect = 0, correctCount = 0;
    var allMissed = [];

    items.forEach(function(it, i){
      var st = itemState[i];
      var gotIt = isItemCorrect(it, st);
      if(gotIt) correctCount++;
      if(it.type==='tc' && gotIt) tcCorrect++;
      if(it.type==='tc2' && gotIt) tcCorrect++;
      if(it.type==='se' && gotIt) seCorrect++;
      if(it.type==='rc' && gotIt) rcCorrect++;

      if(it.type === 'tc' || it.type === 'rc'){
        if(!gotIt) allMissed.push(it.data.options[it.data.correct]);
      } else if(it.type === 'se'){
        if(!gotIt) allMissed = allMissed.concat(it.data.correct.map(function(ci){ return it.data.options[ci]; }));
      } else if(it.type === 'tc2'){
        var aOk = st.selA === it.data.blanks[0].correct;
        var bOk = st.selB === it.data.blanks[1].correct;
        if(!aOk) allMissed.push(it.data.blanks[0].options[it.data.blanks[0].correct]);
        if(!bOk) allMissed.push(it.data.blanks[1].options[it.data.blanks[1].correct]);
      }
    });

    // update persistent state only for a genuine new-day completion
    if(!alreadyDoneToday){
      var y = yesterdayStr();
      if(state.lastCompletedDate === y) state.streak = state.streak + 1;
      else state.streak = 1;
      state.lastCompletedDate = todayStr();
      state.totalCompleted = state.totalCompleted + 1;
      state.missedWords = (state.missedWords || []).concat(allMissed).slice(-40);
      saveState(state);
      streakStat.textContent = state.streak;
    }

    var pct = Math.round(100 * correctCount / items.length);

    var html = '<div class="card">' +
      '<div class="score-big mono">'+correctCount+'<span style="font-size:1.6rem;color:var(--ink-faint);">/'+items.length+'</span></div>' +
      '<div class="score-sub">'+pct+'% correct &middot; finished in '+fmtTime(timerSec)+'</div>' +
      '<div class="breakdown-table">' +
        '<div class="bt-row"><span class="bt-label">Text completion</span><span class="bt-val mono">'+tcCorrect+' / '+tcCount+'</span></div>' +
        '<div class="bt-row"><span class="bt-label">Sentence equivalence</span><span class="bt-val mono">'+seCorrect+' / '+seCount+'</span></div>' +
        '<div class="bt-row"><span class="bt-label">Reading comprehension</span><span class="bt-val mono">'+rcCorrect+' / '+rcCount+'</span></div>' +
      '</div>';

    html += '<h3 style="font-size:1.05rem; margin-bottom:10px;">Words to review</h3>';
    if(allMissed.length){
      html += '<div class="missed-words">' + allMissed.map(function(w){ return '<span class="word-chip">'+esc(w)+'</span>'; }).join('') + '</div>';
    } else {
      html += '<p class="empty-note">Clean sweep on vocabulary today &mdash; nothing to flag.</p>';
    }

    if(!alreadyDoneToday){
      html += '<div class="streak-banner"><div class="sn mono">'+state.streak+'</div><div class="sl">day streak &mdash; a fresh set is ready tomorrow</div></div>';
    }

    html += '<button class="primary start-btn" id="restartBtn">Back to overview</button>';
    html += '</div>';

    appEl.innerHTML = html;
    progressRow.hidden = true;
    document.getElementById('restartBtn').addEventListener('click', function(){
      alreadyDoneToday = state.lastCompletedDate === todayStr();
      screen = 'start';
      render();
    });
  }

  /* ============ ROUTER ============ */
  function render(){
    if(screen === 'start') renderStart();
    else if(screen === 'quiz') renderQuiz();
    else if(screen === 'review') renderReview();
    else if(screen === 'summary') { /* built directly by finishSession */ }
  }

  render();
})();
</script>
</body></html>
